name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gig-platform-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gig-platform-backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: for f in $(git ls-files '*.js'); do node --check "$f"; done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gig-platform-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gig-platform-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
